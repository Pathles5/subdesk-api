# template.yaml — SubDesk API infrastructure (AWS SAM, D-15)
# Phase 03 (docs/specs/03-iac/spec.md §4). Binding topology: 1 DynamoDB table
# (PROVISIONED 25/25, Standard, no GSI/LSI/Streams/PITR/auto scaling — I2/D-26),
# 1 Lambda Event Function behind 1 Function URL (AuthType NONE — D-27), 1 least-
# privilege role (D-24), explicit log group with 30-day retention (I2), and the
# Lambda resource-policy statement that AuthType: NONE requires.
# Secrets are NEVER stored here: they arrive as NoEcho Parameters injected in CI
# with --parameter-overrides from GitHub Secrets (Fase 08 workflow).
# Single region per stack: the target is declared once in infra/deployment.env (D-54); the template itself declares no region.
# Validation gate: `cfn-lint template.yaml` (offline, no credentials — I7/D-31),
# exit 0, no suppressed rules.

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  SubDesk API: one Lambda (Express via serverless-http) behind a Function URL,
  one provisioned DynamoDB table (25/25), one least-privilege role. $0 free-tier
  topology (constitution I2, decisions D-26/D-27).

Parameters:
  TelegramBotTokenParam:
    Type: String
    NoEcho: true
    # Telegram bot tokens look like "<12-digit bot id>:<35-char secret>"; the
    # pattern only enforces shape and a >=16 char minimum, it never stores a value.
    AllowedPattern: '^[0-9]{8,}:[A-Za-z0-9_-]{8,}$'
    Description: >-
      Telegram bot token used by POST /api/tickets/{id}/reply (sendMessage).
      Injected at deploy time via --parameter-overrides from the GitHub Secret
      TELEGRAM_BOT_TOKEN. Never commit this value to git.

  AdminApiKeyParam:
    Type: String
    NoEcho: true
    # Opaque API key compared against the x-api-key header (I4): alphanumeric
    # plus -_. with a >=16 char minimum.
    AllowedPattern: '^[A-Za-z0-9._-]{16,}$'
    Description: >-
      Admin API key validated against the x-api-key header on /api/* routes.
      Injected at deploy time via --parameter-overrides from the GitHub Secret
      ADMIN_API_KEY. Never commit this value to git.

  WebhookSecretParam:
    Type: String
    NoEcho: true
    # Value of X-Telegram-Bot-Api-Secret-Token; any >=16 char non-whitespace
    # token (Telegram accepts ASCII 1-256 chars, no whitespace).
    AllowedPattern: '^\S{16,}$'
    Description: >-
      Shared secret verified on every Telegram webhook call and registered with
      setWebhook. Injected at deploy time via --parameter-overrides from the
      GitHub Secret TELEGRAM_WEBHOOK_SECRET. Never commit this value to git.

# Cost-allocation tags (added in Fase 04 at the user's request): every taggable
# resource carries Project=subdesk-api and, where the form allows, Stack=<stack
# name>. This is what makes the $0-budget evidence (I2) auditable end to end: the
# AWS Budgets guard 'subdesk-api-cent-detect' (0.01 USD/month — USD, not EUR —
# alert ACTUAL GREATER_THAN 0.01) exists to catch the first cent of cost (I2).
# Live filter: the legacy CostFilters field { "TagKeyValue":
# ["user:Project$subdesk-api"] } — 'Project' CAPITALIZED, the key the resources
# really carry; tag keys are case-sensitive and the old unsupported "Tag":
# ["project/subdesk-api"] form matched nothing — a blind guard (false green,
# D-64). Attribution also needs Project ACTIVE as a cost allocation tag
# (Inactive until 2026-11-22, D-63): empty tag results are NOT proof of $0.
# The Lambda tag is REQUIRED — without a
# tag on the function itself its costs never appear in tag filters. On the CFN-
# native resources the Stack value is !Ref AWS::StackName (byte-identical to
# 'subdesk-api-dev' in dev, D-25, and it stays honest if the template is re-hosted
# — runbook 2.7 checklist item 3); on the SAM function it is the literal, for the
# reason documented in that resource's comment. AWS::Lambda::Url supports no Tags
# property and AWS::Lambda::Permission neither supports Tags nor bills anything.
# Enabling the tag keys as cost allocation tags is NOT templatable: it is
# account billing configuration living outside the stack, hence a manual step.
# Already DONE: Project and Stack read Active since 2026-11-22, executed by the
# orchestrator with the user's explicit visto (D-63). Read-only verification:
# `aws ce list-cost-allocation-tags` — Cost Explorer is a GLOBAL service, so
# its endpoint is not the stack region, and region literals in this file must
# all match the single declared target (D-54; the gate scans comments too).
# The literal command is documented in docs/human/runbook.md §5.1 (D-63);
# each key's status must read Active. Consequence on any fresh account: while
# a key is Inactive, tag-filtered cost analysis returns empty, and empty is
# NOT proof of $0 — that false green is precisely what D-63 recorded.
# Tags are metadata only: they change no resource's behavior, capacity or cost.
Resources:
  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 25
        WriteCapacityUnits: 25
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: subdesk-api
        - Key: Stack
          Value: !Ref AWS::StackName

  TicketApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Pinned physical name: the log group name and the role's log-stream ARN
      # below are built from this literal, so the pairing is deterministic.
      FunctionName: TicketApiFunction
      # Handler is ESM (package.json "type": "module"); nodejs26.x supports ESM
      # handlers natively. Runtime + architecture are the user's explicit decision
      # D-61 (supersedes D-40): nodejs26.x is in PUBLIC PREVIEW on Lambda — AWS
      # states preview runtimes are "not covered by the Lambda SLA or Technical
      # Support, and should not be used for production workloads" (runtime GA was
      # expected ~Dec 2026); the user assumes that risk verbatim. The local engine is
      # v26.13.1 (measured with `node -v`, not inherited from the stale D-28 note that
      # said v22.20.0), so the D-40 rationale (local engine == runtime, minimal
      # dev/prod drift) STILL holds and parity is preserved — there is no accepted
      # drift to record. check.ps1 "Runtime parity" keeps the CI Node major pinned to
      # the runtime major and engines.node admitting it. arm64
      # (Graviton) is chosen for price/performance, coherent with I2, and is safe
      # for this artifact: the ZIP carries zero native (.node) binaries — prod deps
      # are express + serverless-http, pure JS (the repo's only .node file is a
      # mermaid-cli devDep, outside the ZIP). Both properties are "Update requires:
      # No interruption" in the CFN registry, so this is an in-place update of the
      # pinned TicketApiFunction: no replacement, no name collision (F03 hazard D4
      # does not apply). Packaging (D-31/D-42, Fase 04 — staging=artifact):
      # the ZIP artifact IS the staging produced by scripts/package-lambda.mjs
      # (no sam build, no gitignore filtering — D-31/I4b fail-closed asserts inside
      # the script). dist/lambda = src/ + production-trimmed package.json + flat
      # hoisted prod node_modules, zero symlinks; deploy.yml materializes it in the
      # deploy workspace and `sam package` zips THAT directory verbatim.
      Handler: src/lambda.handler
      Runtime: nodejs26.x
      Architectures:
        - arm64
      CodeUri: dist/lambda
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt AppRole.Arn
      # Tags map form (not the CFN Key/Value list) is the AWS::Serverless::Function
      # schema; the transform renders it into the generated AWS::Lambda::Function
      # Tags list. REQUIRED for cost allocation: an untagged function is invisible
      # to the Budget/Cost Explorer tag filter (see the tag note above Resources:).
      # Globals: Function: Tags could carry the same keys; per-resource Tags is used
      # deliberately (one function total, no merge semantics to audit).
      # The Stack value here is the literal 'subdesk-api-dev', not !Ref
      # AWS::StackName: the SAM Tags property is a String->String map and the
      # transform's handling of intrinsics inside it is not provable with the
      # offline gate alone, while the literal is byte-identical at deploy time
      # (the stack name is fixed by D-25). The CFN-native resources below keep
      # !Ref AWS::StackName (documented Tags list form). If the stack is ever
      # renamed for another client, updating this literal is part of runbook 2.7
      # bootstrap checklist item (3).
      Tags:
        Project: subdesk-api
        Stack: subdesk-api-dev
      Environment:
        Variables:
          TABLE_NAME: !Ref TicketsTable
          TELEGRAM_BOT_TOKEN: !Ref TelegramBotTokenParam
          ADMIN_API_KEY: !Ref AdminApiKeyParam
          TELEGRAM_WEBHOOK_SECRET: !Ref WebhookSecretParam
          LOG_LEVEL: info
          # v1 is single-stage (D-17): fixed 'dev', not a stack Parameter.
          STAGE: dev

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        # D-24 (spec 03 §4.2): exactly two statements, nothing else. No managed
        # policies, no logs:CreateLogGroup (the log group is an explicit
        # resource below), no dynamodb:Query/Delete/Describe, no wildcards.
        - PolicyName: SubDeskApiAppPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Scan
                Resource: !GetAtt TicketsTable.Arn
              # The function-name segment is the literal that matches the pinned
              # FunctionName above. A Ref/Sub to the function logical ID here
              # would close a static cycle Function->Role->Function (cfn-lint
              # E3004): the spec's !Sub form is byte-identical at deploy time,
              # this is the narrowest lint-clean equivalent. See report, T-05.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/TicketApiFunction:*
      # AWS::IAM::Role Tags: Key/Value list form. The role bills nothing itself
      # (I2), the tag is for the tag-grouped resource inventory in Cost Explorer.
      Tags:
        - Key: Project
          Value: subdesk-api
        - Key: Stack
          Value: !Ref AWS::StackName

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # Pre-created: the implicit group Lambda would auto-create has no
      # retention (I2 requires <= 30 days). The name matches the pinned
      # FunctionName. No DependsOn: the Ref substitution in !Sub already
      # orders this resource after the function (cfn-lint W3005).
      LogGroupName: !Sub /aws/lambda/${TicketApiFunction}
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: subdesk-api
        - Key: Stack
          Value: !Ref AWS::StackName

  # The Function URL is declared as the CFN-native resource, NOT as the SAM
  # `FunctionUrlConfig` property. Reason, verified with cfn-lint 1.61.0:
  # `Fn::GetAtt TicketApiFunction.Url` is rejected (E6101: the SAM schema only
  # exposes Arn/SnapStart* attributes on AWS::Serverless::Function), the SAM
  # event/property form supports no LogicalId override, and the generated child
  # AWS::Lambda::Url has no logical ID visible to the template, so the
  # FunctionUrl Output cannot be expressed lint-clean any other way. Same
  # substance (D-27): AuthType NONE, BUFFERED, CORS declared only here.
  # Cleanup note (Fase 00 §10a, runbook): deleting a NONE-auth URL leaves this
  # resource policy behind; the stack delete removes the statement too, a
  # manual URL delete needs manual policy cleanup.
  TicketApiUrlConfig:
    Type: AWS::Lambda::Url
    # The invoke permission is attached to the function before the URL exists.
    DependsOn: TicketApiUrlInvokePermission
    Properties:
      AuthType: NONE
      # BUFFERED is the default invoke mode and the only billable-free one for
      # this topology (D-26); declared for explicitness, never response-stream.
      InvokeMode: BUFFERED
      TargetFunctionArn: !GetAtt TicketApiFunction.Arn
      Cors:
        AllowOrigins:
          - '*'
        # OPTIONS is deliberately excluded: the schema's valid method enum does
        # not include it (cfn-lint E3030) and Function URL answers preflight
        # itself from this config (I4). Same substance as spec §4.1.
        AllowMethods:
          - GET
          - POST
          - PATCH
        # Array form (schema type is array of strings; the spec's single
        # comma-joined string fails E3012). Headers keep the spec's list.
        AllowHeaders:
          - x-api-key
          - Content-Type
          - X-Telegram-Bot-Api-Secret-Token
        MaxAge: 300
        # AllowCredentials omitted on purpose: invalid with AllowOrigins ['*'] (I4).
      # No Tags here: the AWS::Lambda::Url resource type (CFN template reference,
      # verified 2026-11-22) exposes only AuthType/Cors/InvokeMode/Qualifier/
      # TargetFunctionArn — a Tags property would fail cfn-lint E3002. The URL is
      # not a billable resource (D-27), so it is absent from tag cost filters by
      # nature; its cost story is fully covered by the tagged function.

  TicketApiUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      # Public unauthenticated Function URL (AuthType: NONE — D-27) needs this
      # statement to be callable. The documented shape is the CFN
      # AWS::Lambda::Permission reference, canonical example "Public Function
      # URL Invoke": Action lambda:InvokeFunctionUrl + Principal '*' +
      # FunctionUrlAuthType NONE.
      # (i) There is no "AWS URL service" principal: the previous
      #     `Principal: AWS:UrlInvoke` does not exist. A public URL permission
      #     is granted to '*' scoped by FunctionUrlAuthType: NONE — that pairing
      #     is how AWS documents an unauthenticated public endpoint (D-27).
      #     Real least-privilege scope comes from FunctionName pinned to
      #     exactly one function ARN (AWS::Lambda::Permission admits no
      #     Condition, and a URL's SourceArn carries a runtime-generated config
      #     id that cannot be referenced statically without a cycle).
      # (ii) Action must be lambda:InvokeFunctionUrl (invoke via URL). The
      #     previous lambda:CreateFunctionUrlConfig is the action for CREATING
      #     the URL config, which the TicketApiUrlConfig resource
      #     (AWS::Lambda::Url) already performs; this statement grants
      #     invocation, not provisioning.
      # (iii) Evidence of the real failure (run 45044899842, attempt 4,
      #     2026-11-22T20:00:05Z): Lambda returned CREATE_FAILED — "The
      #     provided input 'AWS:UrlInvoke' was invalid. Member must satisfy
      #     expression: [\w+=,.@-]*" (Status 400, HandlerErrorCode
      #     InvalidRequest; the colons break the expression). Full rollback,
      #     four resources DELETE_COMPLETE, zero live resources, $0. cfn-lint
      #     could NOT catch this: the CFN Action pattern
      #     ^(lambda:[*]|lambda:[a-zA-Z]+|[*])$ accepts any lambda:<word>, and
      #     Principal is a free String in the template — Lambda validates it
      #     server-side at creation time.
      # (iv) Deliberately NOT migrated to AWS::Lambda::ResourcePolicy (the form
      #     the CFN docs recommend) right now: mixing a resource-model change
      #     with the first stack would muddy the evidence. Registered as an
      #     F09 hardening candidate.
      Action: lambda:InvokeFunctionUrl
      FunctionName: !GetAtt TicketApiFunction.Arn
      FunctionUrlAuthType: 'NONE'
      Principal: '*'
      # AWS::Lambda::Permission admits no Tags property (schema has none); the
      # statement is not a billable resource either, so it stays outside the
      # cost-allocation tag set. Its cost story is carried by the tagged function.

  # Second half of the resource policy that AuthType: NONE requires. Authority is
  # the Lambda developer guide (lambda/latest/dg/urls-auth.html), NOT the
  # CloudFormation reference example used for the block above, which is stale and
  # shows a single statement:
  #   "Starting in October 2025, new function URLs will require both
  #    lambda:InvokeFunctionUrl and lambda:InvokeFunction permissions."
  #   "If a function's resource-based policy doesn't grant lambda:InvokeFunctionUrl
  #    and lambda:InvokeFunction, users get a 403 Forbidden ... even if the function
  #    URL uses the NONE auth type."
  #   "When you create a function URL with auth type NONE using the console or AWS
  #    SAM, Lambda automatically creates the resource-based policy for you. If
  #    you're using the AWS CLI, AWS CloudFormation, or the Lambda API directly,
  #    you must add the policy yourself." <- our exact case: the URL is declared as
  #    the CFN-native AWS::Lambda::Url (spec 03 A-01), so nobody adds it for us.
  # (i) Evidence of the real failure (stack subdesk-api-dev CREATE_COMPLETE, run
  #     45065067527, commit a1980ca, URL live): every request answered
  #     HTTP/1.1 403 Forbidden with header x-amzn-ErrorType: AccessDeniedException
  #     and body {"Message":"Forbidden. Invoking a Function URL requires both the
  #     lambda:InvokeFunctionUrl and lambda:InvokeFunction permissions."}
  #     (x-amzn-RequestId 54870695-61e0-4b8b-983b-22221c0f40b8). The body is
  #     Lambda's own, not the app's, and the log group had ZERO log streams: the
  #     function was never invoked. `aws lambda get-policy` showed exactly one
  #     statement (lambda:InvokeFunctionUrl) - the one above.
  # (ii) InvokedViaFunctionUrl: true is the CFN form of the condition
  #     `Bool lambda:InvokedViaFunctionUrl = "true"` that the guide pairs with this
  #     statement (AWS::Lambda::Permission admits no Condition property; it exposes
  #     this Boolean instead). It is a least-privilege requirement, not decoration:
  #     without it, `Principal: '*'` + lambda:InvokeFunction would allow invoking
  #     the function by ANY path (SDK Invoke, event-source mappings, other
  #     accounts' tooling), not only through the function URL. The guide says so:
  #     "This context key ensures that the function can only be invoked through the
  #     function URL and not through other invocation methods."
  # (iii) No FunctionUrlAuthType here on purpose: the guide scopes that key to the
  #     lambda:InvokeFunctionUrl statement only, and mixing it into this one could
  #     invalidate the condition. The two resources are additive: the block above is
  #     byte-identical to what the live stack already has.
  # (iv) DependsOn (below) serializes the two Permissions ON PURPOSE: both
  #     AddPermission calls are a read-modify-write on the SAME resource policy,
  #     and on a cold CREATE CloudFormation may issue them in parallel, which
  #     Lambda can answer with ResourceConflictException. Serializing costs ~1 s
  #     and changes neither topology nor cost. Not needed for the in-place UPDATE
  #     that D-61 produces, but required for the next from-scratch create.
  #     TicketApiUrlConfig keeps pointing only at the first Permission.
  # Cost: AWS::Lambda::Permission bills nothing (I2 intact).
  TicketApiUrlInvokePermissionViaUrl:
    Type: AWS::Lambda::Permission
    # Serialize the two AddPermission read-modify-write calls on the same
    # resource policy — full reason in (iv) above.
    DependsOn: TicketApiUrlInvokePermission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt TicketApiFunction.Arn
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Public HTTPS endpoint (the only one; D-27). Register it with setWebhook in Fase 08.
    Value: !GetAtt TicketApiUrlConfig.FunctionUrl
  TableName:
    Description: Single tickets table (PROVISIONED 25/25, I2/D-26).
    Value: !Ref TicketsTable
  LogsGroupName:
    Description: Explicit log group for the function (30-day retention, I2).
    Value: !Ref ApiLogGroup
