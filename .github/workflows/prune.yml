# prune.yml — controlled demolition of the dev stack (Fase 04, T-04; spec §4/§5).
#
# workflow_dispatch ONLY — never push, never schedule. DOUBLE confirmation, both
# mechanical and auditable (D-42):
#   (1) dispatch-only: the run cannot start by itself and cannot start from a push or
#       a schedule — a human with write access has to launch it by hand, and that
#       action IS the I6 visto for a destructive operation;
#   (2) the `confirm` input must equal the literal BORRO-SUBDESK-API-DEV exactly,
#       typed by that human (verify-approval fails closed on anything else,
#       case-sensitive).
# Note on the `destroy` job's `environment: dev`: it contributes the secrets and the
# OIDC `sub` claim in its INMUTABLE form (`repo:Pathles5@43617338/subdesk-api@1462037116:
# environment:dev` — D-50/D-51: post-2026-07-15 repo, so the legacy name-only claim is
# never minted here; format verified against
# `gh api repos/Pathles5/subdesk-api/actions/oidc/customization/sub`) that
# SubDeskCiDeployRole's trust condition demands, so a job without the pin simply gets
# no credentials (D-43, fail-closed). It is NOT a human reviewer: by the user's explicit
# decision (D-48) the environment carries no required reviewers and nothing waits for an
# approval click.
#
# Identity: OIDC ONLY (D-43) — no static AWS keys referenced (spec §5.3; the
# check.ps1 assert over .github/** must stay green).
#
# What is deleted: the whole CloudFormation stack subdesk-api-dev — TicketsTable
# WITH ANY REAL TICKET DATA (export first; runbook §4), TicketApiFunction, its log
# group, the Function URL AND its AuthType:NONE resource-policy statement (deleting
# the complete stack leaves no orphaned policy — runbook §4 note).
#
# What is NOT deleted: the SAM artifacts bucket (ARTIFACTS_BUCKET in infra/deployment.env
# — a per-region name since D-54). Its objects already expire after 30 days via the
# lifecycle rule that deploy.yml guarantees on every run, so the residual cost is ~$0
# (within S3 free tier; the bucket itself was accepted in D-15 at <$0.01/mes). Deleting
# the bucket would need s3:DeleteBucket/DeleteObject/PutBucketVersioning permissions the
# CI role deliberately does NOT carry. Empty-while-deleting is also NOT attempted.
name: prune
run-name: prune subdesk-api-dev (${{ github.event.inputs.confirm }})

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Type exactly BORRO-SUBDESK-API-DEV to authorize deleting the dev stack,
          including the DynamoDB TicketsTable and all its data.
        required: true
        type: string

permissions:
  id-token: write   # OIDC federation (D-43)
  contents: read    # since D-54 the destroy job checks the repo out — ONLY to read
                    # infra/deployment.env (its region/stack source of truth); nothing else

concurrency:
  # Same group as deploy.yml ("concurrency igual", T-04 brief): a prune dispatch
  # cancels an in-flight deploy and vice versa — the two must never race against
  # one stack (single executor, D-42).
  group: subdesk-api-dev-deploy
  cancel-in-progress: true

jobs:
  verify-approval:
    name: verify-approval — refuse unless the confirmation literal matches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the confirmation input (exact string, case-sensitive)
        # The input travels through step env, never interpolated into the shell
        # script text (input-controlled command injection is still a command
        # injection even on a credential-less job).
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "BORRO-SUBDESK-API-DEV" ]; then
            echo "Aborting: 'confirm' must be exactly BORRO-SUBDESK-API-DEV." >&2
            exit 1
          fi
          echo "Confirmation literal matched - dispatch plus the exact literal are"
          echo "the two confirmations. There is no environment reviewer (D-48)."

  destroy:
    name: destroy — delete-stack subdesk-api-dev and wait for DELETE_COMPLETE
    needs: verify-approval
    runs-on: ubuntu-latest
    # environment: dev — secret scope + the OIDC `sub` claim binding that lets this job
    # assume SubDeskCiDeployRole at all (D-43, fail-closed: without the pin there are no
    # AWS credentials). NOT the second confirmation: by D-48 this environment has no
    # required reviewers, so the two real confirmations stay dispatch + exact literal.
    environment: dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: load-deploy-config — single source of truth for region and names (D-54)
        # Same loader as deploy.yml's jobs: the region and stack name destroyed here are
        # read from infra/deployment.env, never hardcoded, so prune can never target a
        # different region than the one the deploy pipeline just moved to (the failure
        # mode this parametrization exists to kill). `set -u` aborts fail-closed if the
        # file or a key is missing — a missing file means NO delete call is issued at all.
        # checkout is required for this step (the file lives in the repo); it was not
        # needed before because the job's only inputs were secrets and literals.
        run: |
          set -euo pipefail
          set -a; . infra/deployment.env; set +a
          {
            echo "AWS_REGION=$AWS_REGION"
            echo "STACK_NAME=$STACK_NAME"
            echo "SAM_BUCKET=$ARTIFACTS_BUCKET"
            echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
          } >> "$GITHUB_ENV"
          echo "prune target loaded: region=$AWS_REGION stack=$STACK_NAME"

      - name: Configure AWS credentials via OIDC (no static keys — D-43)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}   # from infra/deployment.env via the step above — same source of truth as deploy.yml (D-54)
          role-session-name: github-subdesk-prune

      - name: Delete the stack and poll describe-stacks until DELETE_COMPLETE
        # cloudformation:DeleteStack and DescribeStacks on stack/subdesk-api-dev/*
        # are already in SubDeskCiDeployPolicy (bootstrap §2). Once CFN drops the
        # stack record, describe-stacks errors and the query yields nothing: that
        # absence IS DELETE_COMPLETE (CFN keeps deleted records ~500 days only via
        # history, not via describe-stacks).
        # GAP HISTORY (closed and verified — this replaced a "KNOWN GAP" note): the
        # live policy once lacked logs:DeleteLogGroup, so deleting the stack's API
        # log group could fail AccessDenied -> DELETE_FAILED. That gap was real, was
        # closed in the audited A-03.3 policy and IS APPLIED IN AWS since today
        # (aws iam put-role-policy under the user's one-off authorization D-49; the
        # live LogsScoped sid re-read after the put carries logs:DeleteLogGroup over
        # log-group:/aws/lambda/TicketApiFunction*, and the simulate-principal-policy
        # pre-flight returned 22/22 allowed). A log-group DELETE_FAILED is therefore
        # NO LONGER expected here: if one ever appears it is a regression (policy
        # drift since D-49) to investigate, NOT a known gap to re-fix via bootstrap.
        run: |
          set -uo pipefail
          aws cloudformation delete-stack --stack-name "$STACK_NAME" --region "$AWS_REGION"
          for i in $(seq 1 60); do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' --output text 2>/dev/null || true)
            if [ -z "$STATUS" ] || [ "$STATUS" = "None" ] || [ "$STATUS" = "DELETE_COMPLETE" ]; then
              echo "Stack $STACK_NAME is DELETE_COMPLETE (gone from describe-stacks)."
              exit 0
            fi
            echo "poll $i: $STATUS"
            case "$STATUS" in
              *FAILED*)
                echo "Aborting: stack status $STATUS. Inspect the CFN events; a stuck" >&2
                echo "resource (log group?) means policy drift since D-49 — investigate," >&2
                echo "do not blind-retry and do not assume the bootstrap is unfixed." >&2
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Timed out (~30 min) waiting for DELETE_COMPLETE." >&2
          exit 1
